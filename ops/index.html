<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMF 運営</title>
<link rel="icon" href="data:,">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#0f1524; --card:#182033; --line:#2a3550; --tx:#eef2fa; --dim:#93a0bd;
    --accent:#4f8cff; --ok:#3ecf8e; --warn:#ffb020; --bad:#ff6b6b;
    --pad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px; line-height:1.7;
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }

  header{
    padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
  }
  header .t{font-weight:700;font-size:16px;letter-spacing:.02em}
  header .who{margin-left:auto;font-size:12px;color:var(--dim)}

  main{flex:1; overflow-y:auto; padding:var(--pad); display:flex; flex-direction:column; gap:12px}

  .hint{color:var(--dim);font-size:13px;text-align:center;padding:28px 10px;line-height:1.9}
  .hint b{color:var(--tx);font-weight:600}

  .row{display:flex;flex-direction:column;gap:6px}
  .row.me{align-items:flex-end}
  .bub{
    max-width:88%; padding:10px 13px; border-radius:14px; white-space:pre-wrap;
    word-break:break-word; font-size:14.5px;
  }
  .me .play{align-self:flex-end}
  .me .bub{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .bot .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .meta{font-size:11px;color:var(--dim);padding:0 4px}
  .me .meta{text-align:right}

  .state{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;padding:2px 4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:p 1.1s infinite}
  @keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

  .err{background:#2a1a1f;border:1px solid #5a2b33;color:#ffc9c9;padding:10px 13px;border-radius:12px;font-size:13.5px}

  .play{
    margin-top:2px; display:inline-flex; align-self:flex-start; align-items:center; gap:7px; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--dim);
    padding:5px 11px; border-radius:999px; font-size:12.5px; font-family:inherit;
  }
  .play.on{border-color:var(--accent);color:var(--accent)}

  footer{
    border-top:1px solid var(--line); padding:10px var(--pad)
    calc(env(safe-area-inset-bottom) + 10px);
    display:flex; gap:9px; align-items:flex-end; background:var(--bg);
  }
  textarea{
    flex:1; resize:none; background:var(--card); color:var(--tx);
    border:1px solid var(--line); border-radius:20px; padding:10px 14px;
    font:inherit; font-size:15px; max-height:110px; min-height:42px; line-height:1.5;
  }
  textarea:focus{outline:none;border-color:var(--accent)}
  .btn{
    flex:0 0 42px; height:42px; border-radius:50%; border:0; cursor:pointer;
    background:var(--card); color:var(--tx); font-size:19px; display:flex;
    align-items:center; justify-content:center; font-family:inherit;
  }
  .btn.go{background:var(--accent);color:#fff}
  .btn.rec{background:var(--bad);color:#fff;animation:r 1.2s infinite}
  @keyframes r{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}70%{box-shadow:0 0 0 11px rgba(255,107,107,0)}}
  .btn:disabled{opacity:.4}

  .gate{padding:60px var(--pad);text-align:center;color:var(--dim);line-height:2}
  .gate b{display:block;color:var(--tx);font-size:16px;margin-bottom:10px}
  .ver{text-align:center;color:#4a5570;font-size:10.5px;padding:6px 0 2px}
</style>
</head>
<body>

<header>
  <span class="t">SMF 運営</span>
  <span class="who" id="who">つないでいます…</span>
</header>

<main id="main">
  <div class="hint" id="hint">
    台帳に聞けます。<br>
    <b>マイクを押して、話すだけ。</b><br><br>
    「協賛は今何件？」<br>
    「ロゴが届いていない協賛は？」<br>
    「今週が期限で終わっていないタスクは？」<br>
    「調子はどう？」
  </div>
</main>

<footer id="foot" style="display:none">
  <textarea id="q" rows="1" placeholder="打ち込んでも聞けます" enterkeyhint="send"></textarea>
  <button class="btn" id="mic" title="声で聞く">●</button>
  <button class="btn go" id="send" title="送る">↑</button>
</footer>
<div class="ver">運営ミニアプリ v0.1</div>

<script>
/* ============================================================================
 *  SMF2026 運営向けミニアプリ  v0.1  2026-09-29
 *
 *  ■ なぜブラウザなのか
 *    LINEのトークに声で返すと、いま60秒かかります。そのうち44秒は
 *    「トークがWAVを再生できないので、m4aに変換してDriveに置いて公開する」分。
 *    ブラウザはWAVをそのまま鳴らせるので、その手続きがまるごと要りません。
 *
 *  ■ 置き場所
 *    GitHub Pages（smf-assets/ops/index.html）。GASのウェブアプリに POST します。
 *
 *  ■ 直すのは下の CONFIG だけです
 * ========================================================================== */
const CONFIG = {
  // LINE Developers で作る「運営用」ミニアプリの LIFF ID（来場者向けとは別のチャネル）
  LIFF_ID: '2011781779-Jc5eAPna',
  // SMF BOT v3.3 のウェブアプリURL（/exec まで）。来場者向けミニアプリと同じものです
  GAS_URL: 'https://script.google.com/macros/s/AKf.../exec'
};

const $ = (id) => document.getElementById(id);
const main = $('main');
let idToken = '';
let busy = false;
let rec = null, chunks = [], recMime = '';

/* ---------------------------------------------------------------- 画面 */

function clearHint(){ const h = $('hint'); if (h) h.remove(); }

function bubble(who, text){
  clearHint();
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'bub';
  b.textContent = text;
  row.appendChild(b);
  main.appendChild(row);
  main.scrollTop = main.scrollHeight;
  return row;
}

function meta(row, text){
  let m = row.querySelector('.meta');
  if (!m) { m = document.createElement('div'); m.className = 'meta'; row.appendChild(m); }
  m.textContent = text;
  main.scrollTop = main.scrollHeight;
}

function state(text){
  clearHint();
  let s = $('st');
  if (!s) {
    s = document.createElement('div');
    s.className = 'state'; s.id = 'st';
    s.innerHTML = '<span class="dot"></span><span></span>';
    main.appendChild(s);
  }
  s.lastElementChild.textContent = text;
  main.scrollTop = main.scrollHeight;
}
function stateOff(){ const s = $('st'); if (s) s.remove(); }

function showErr(text){
  clearHint(); stateOff();
  const d = document.createElement('div');
  d.className = 'err'; d.textContent = text;
  main.appendChild(d);
  main.scrollTop = main.scrollHeight;
}

/* ---------------------------------------------------------------- 通信 */

async function api(payload){
  const res = await fetch(CONFIG.GAS_URL, {
    method: 'POST',
    // GASのウェブアプリは、この形だと事前確認なしで受け取れます
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ kind: 'ops', idToken: idToken }, payload))
  });
  if (!res.ok) throw new Error('つながりませんでした（' + res.status + '）');
  return await res.json();
}

const ERR = {
  login:   'LINEで開き直してください。運営メンバーとして確かめられませんでした。',
  'too many': '回数の上限に達しました。少し時間をおいてください。',
  'too big':  '録音が長すぎます。短くしてもう一度お願いします。',
  empty:   '聞き取れませんでした。もう一度お願いします。',
  transcribe: '文字にできませんでした。もう一度お願いします。',
  closed:  'いまは使えません。'
};

/* ---------------------------------------------------------------- 聞く */

async function ask(payload, shownText){
  if (busy) return;
  busy = true;
  const myRow = bubble('me', shownText || '（声で質問）');
  const t0 = Date.now();

  // 返事は1回で返ってくるので、途中の表示は時間で進めます。
  // 黙っているより、いま何をしているかが見えるほうが待てます。
  const steps = payload.audio
    ? [[0, '聞き取っています…'], [9, '台帳を見ています…'], [18, 'もう少しお待ちください…']]
    : [[0, '台帳を見ています…'], [8, 'もう少しお待ちください…']];
  let si = 0;
  state(steps[0][1]);
  const timer = setInterval(() => {
    const el = (Date.now() - t0) / 1000;
    while (si + 1 < steps.length && el >= steps[si + 1][0]) { si++; state(steps[si][1]); }
  }, 500);

  try {
    const d = await api(Object.assign({ api: 'ask' }, payload));
    clearInterval(timer);
    if (d.error) { showErr(ERR[d.error] || (d.msg || 'うまくいきませんでした')); return; }

    if (payload.audio && d.heard) myRow.querySelector('.bub').textContent = d.heard;
    stateOff();
    const row = bubble('bot', d.answer);
    meta(row, ((Date.now() - t0) / 1000).toFixed(1) + '秒' + (d.parts ? '　' + d.parts : ''));

    if (d.speakable) speak(d.speakable, row);
  } catch (err) {
    clearInterval(timer);
    showErr(String(err.message || err));
  } finally {
    clearInterval(timer); stateOff(); busy = false;
  }
}

/* ---------------------------------------------------------------- 声で返す */

async function speak(text, row){
  const btn = document.createElement('button');
  btn.className = 'play';
  btn.textContent = '♪ 声を用意しています…';
  btn.disabled = true;
  row.appendChild(btn);
  main.scrollTop = main.scrollHeight;

  try {
    const d = await api({ api: 'speak', text: text });
    if (d.error || !d.audio) { btn.remove(); return; }
    // ブラウザは WAV をそのまま鳴らせます（ここが LINE との違いです）
    const audio = new Audio('data:' + (d.mime || 'audio/wav') + ';base64,' + d.audio);
    btn.textContent = '▶ 聞く';
    btn.disabled = false;
    btn.classList.add('on');
    btn.onclick = () => {
      if (audio.paused) { audio.play(); btn.textContent = '■ 止める'; }
      else { audio.pause(); audio.currentTime = 0; btn.textContent = '▶ 聞く'; }
    };
    audio.onended = () => { btn.textContent = '▶ もう一度'; };
    audio.play().then(() => { btn.textContent = '■ 止める'; }).catch(() => { /* 自動で鳴らせない端末は押してもらう */ });
  } catch (err) { btn.remove(); }
}

/* ---------------------------------------------------------------- 録音 */

function pickMime(){
  const list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac', ''];
  for (const m of list) {
    if (!m) return '';
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

async function recStart(){
  if (busy) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recMime = pickMime();
    rec = new MediaRecorder(stream, recMime ? { mimeType: recMime } : undefined);
    chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType || recMime || 'audio/webm' });
      if (blob.size < 1200) { showErr('短すぎました。もう一度押して、話してから離してください。'); return; }
      const b64 = await toBase64(blob);
      ask({ audio: b64, mime: (rec.mimeType || recMime || 'audio/webm') });
    };
    rec.start();
    $('mic').classList.add('rec');
    $('mic').textContent = '■';
    state('聞いています…（もう一度押すと送ります）');
  } catch (err) {
    showErr('マイクを使えませんでした。LINEの設定でマイクを許可してください。');
  }
}

function recStop(){
  if (!rec || rec.state === 'inactive') return;
  rec.stop(); rec = null;
  $('mic').classList.remove('rec');
  $('mic').textContent = '●';
  stateOff();
}

function toBase64(blob){
  return new Promise((ok, ng) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1] || '');
    r.onerror = ng;
    r.readAsDataURL(blob);
  });
}

/* ---------------------------------------------------------------- 立ち上げ */

$('mic').onclick = () => { (rec && rec.state === 'recording') ? recStop() : recStart(); };
$('send').onclick = () => {
  const t = $('q').value.trim();
  if (!t) return;
  $('q').value = ''; $('q').style.height = 'auto';
  ask({ text: t }, t);
};
$('q').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(110, this.scrollHeight) + 'px';
});

function gate(msg){
  main.innerHTML = '<div class="gate"><b>使えません</b>' + msg + '</div>';
  $('foot').style.display = 'none';
  $('who').textContent = '';
}

(async () => {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken() || '';
    if (!idToken) { gate('LINEアプリの中から開いてください。'); return; }

    const me = await api({ api: 'me' });
    if (me.error) {
      gate(me.error === 'login'
        ? 'この画面は運営メンバー専用です。<br>心当たりがあれば事務局にお伝えください。'
        : 'いまは使えません。');
      return;
    }
    $('who').textContent = me.name || '';
    $('foot').style.display = 'flex';
  } catch (err) {
    gate('つなげませんでした。<br>時間をおいて開き直してください。<br><small>' + String(err.message || err).slice(0, 80) + '</small>');
  }
})();
</script>
</body></html>
