<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harmonizer</title>
<link rel="icon" href="https://hiromitsu81.github.io/smf-assets/app/img/smf-logo.png">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* SMFのロゴの3色（桃・緑・青）を、そのまま画面の色に使っています */
  :root{
    --bg:#0b0d12; --card:#171a22; --line:#2a2f3c;
    --tx:#f2f4f8; --dim:#8b93a6;
    --pink:#e07c8e; --pink-d:#c9566b;
    --green:#8cc63f;
    --blue:#5b9bd5;
    --red:#ff5b5b;
    --amber:#f3c14b;   /* 5つめ「調べる」。提灯の灯りの色 */
    --pad:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{
    background:
      radial-gradient(130% 55% at 50% 0%, #1b1f2b 0%, transparent 62%),
      var(--bg);
    color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px; line-height:1.72;
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- 上 ---------- */
  header{
    padding:calc(env(safe-area-inset-top) + 13px) var(--pad) 12px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(11,13,18,.8); backdrop-filter:blur(14px);
    position:sticky; top:0; z-index:5;
  }
  .logo{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#fff;display:block}
  .logo-fb{
    width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#fff;color:#111;
    display:none;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:-.03em;
  }
  header .t{font-weight:700;font-size:15px;letter-spacing:.06em}
  header .who{
    margin-left:auto;font-size:11.5px;color:var(--dim);
    display:flex;align-items:center;gap:6px;
  }
  header .who .led{width:6px;height:6px;border-radius:50%;background:var(--green)}

  /* ---------- 会話 ---------- */
  main{flex:1;overflow-y:auto;padding:var(--pad) var(--pad) 8px;
       display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}

  .lead{text-align:center;padding:26px 6px 10px}
  .lead img.hero{width:74px;height:74px;border-radius:50%;background:#fff;margin:0 0 18px}
  .lead .big{font-size:20px;font-weight:700;letter-spacing:.01em;line-height:1.5}
  .lead .sub{color:var(--dim);font-size:13px;margin-top:8px}

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
  .chip{
    border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--tx);
    padding:8px 14px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;
  }
  .chip:active{background:rgba(140,198,63,.16);border-color:var(--green)}

  .row{display:flex;flex-direction:column;gap:6px}
  .row.me{align-items:flex-end}
  .bub{
    max-width:89%;padding:11px 15px;border-radius:17px;white-space:pre-wrap;
    word-break:break-word;font-size:14.5px;
  }
  .me .bub{
    background:linear-gradient(145deg,var(--pink),var(--pink-d));
    color:#fff;font-weight:600;border-bottom-right-radius:5px;
  }
  .bot .bub{
    background:var(--card);border:1px solid var(--line);
    border-bottom-left-radius:5px;
  }
  .bot .bub::first-line{font-weight:600}
  .cur{display:inline-block;width:2px;height:1em;background:var(--green);
       vertical-align:-2px;margin-left:1px;animation:blink .9s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .skip{text-align:center;color:var(--dim);font-size:11.5px;padding:2px 0}

  .bub.zoom{font-size:18px;line-height:1.85}
  .digmenu{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}

  .meta{font-size:11px;color:var(--dim);padding:0 5px}
  .me .meta{text-align:right}

  .state{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:13px;padding:2px 5px}
  .eq{display:flex;align-items:flex-end;gap:2.5px;height:14px}
  .eq i{width:3px;border-radius:2px;animation:eq .95s infinite ease-in-out}
  .eq i:nth-child(1){background:var(--pink);animation-delay:0s}
  .eq i:nth-child(2){background:var(--green);animation-delay:.13s}
  .eq i:nth-child(3){background:var(--blue);animation-delay:.26s}
  .eq i:nth-child(4){background:var(--pink);animation-delay:.39s}
  @keyframes eq{0%,100%{height:4px;opacity:.5}50%{height:14px;opacity:1}}

  .err{
    background:rgba(255,91,91,.09);border:1px solid rgba(255,91,91,.34);
    color:#ffd0d0;padding:11px 14px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;
  }

  .play{
    align-self:flex-start;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    background:rgba(140,198,63,.1);border:1px solid rgba(140,198,63,.45);color:var(--green);
    padding:7px 15px;border-radius:999px;font:inherit;font-size:13px;
  }
  .play[disabled]{background:transparent;border-color:var(--line);color:var(--dim)}

  /* ---------- 下・マイクが主役 ---------- */
  footer{
    padding:6px var(--pad) calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(to top,var(--bg) 58%,transparent);
    position:sticky;bottom:0;
  }
  .typebar{display:flex;gap:9px;align-items:flex-end;margin-bottom:15px;opacity:.9}
  textarea{
    flex:1;resize:none;background:rgba(255,255,255,.04);color:var(--tx);
    border:1px solid var(--line);border-radius:18px;padding:9px 15px;
    font:inherit;font-size:14.5px;max-height:104px;min-height:38px;line-height:1.5;
  }
  textarea::placeholder{color:var(--dim)}
  textarea:focus{outline:none;border-color:rgba(91,155,213,.6);background:rgba(255,255,255,.06)}
  .send{
    flex:0 0 38px;height:38px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
    background:rgba(255,255,255,.04);color:var(--dim);font-size:16px;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
  }
  .send.on{background:var(--blue);color:#fff;border-color:transparent}

  /* 読む・書く・聞く・話す。言語の4つの技能そのものなので、説明が要りません。
     こちらから出すのが「書く・話す」、返ってくるのが「読む・聞く」です。 */
  .pads{display:flex;justify-content:center;align-items:flex-end;gap:9px}
  .pad{display:flex;flex-direction:column;align-items:center;gap:7px;flex:0 0 auto}
  .pad .cap{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--tx)}
  .pad.off .cap{color:#4b5366}

  .ring{
    position:relative;width:56px;height:56px;border-radius:50%;padding:3px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .ring.tri{
    width:70px;height:70px;padding:4px;
    background:conic-gradient(var(--pink) 0deg 120deg, var(--green) 120deg 240deg, var(--blue) 240deg 360deg);
  }
  .ring.blue{background:var(--blue)}
  .ring.green{background:var(--green)}
  .ring.pink{background:var(--pink)}
  .ring.amber{background:var(--amber)}
  .ring.amber > button svg{fill:var(--amber)}
  .ring > button{
    width:100%;height:100%;border-radius:50%;border:0;cursor:pointer;background:#0f1218;
    display:flex;align-items:center;justify-content:center;transition:transform .12s ease;padding:0;
  }
  .ring.tri > button{background:#fff}
  .ring > button:active{transform:scale(.93)}
  .ring > button svg{width:23px;height:23px}
  .ring.tri > button svg{width:29px;height:29px;fill:#111}
  .ring.blue > button svg{fill:var(--blue)}
  .ring.green > button svg{fill:var(--green)}
  .ring.pink > button svg{fill:var(--pink)}

  .pad.off .ring{background:var(--line);box-shadow:none}
  .pad.off .ring > button{background:#14171f}
  .pad.off .ring > button svg{fill:#464e61}

  .ring.busy::after{
    content:'';position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
    border:2px solid rgba(255,255,255,.35);animation:ring 1.5s infinite ease-out;
  }
  .pad.on .ring{box-shadow:0 8px 26px rgba(140,198,63,.35)}

  .micwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  /* ロゴの「丸のなかに3色」を、そのままボタンにしています */
  .micring{
    position:relative;width:98px;height:98px;border-radius:50%;
    background:conic-gradient(var(--pink) 0deg 120deg, var(--green) 120deg 240deg, var(--blue) 240deg 360deg);
    padding:5px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 34px rgba(0,0,0,.45);
  }
  .mic{
    width:100%;height:100%;border-radius:50%;border:0;cursor:pointer;background:#fff;
    display:flex;align-items:center;justify-content:center;transition:transform .12s ease;
  }
  .mic:active{transform:scale(.94)}
  .mic svg{width:36px;height:36px;fill:#111}
  .micring.rec{background:var(--red);animation:spinoff 0s}
  .micring.rec .mic{background:#111}
  .micring.rec .mic svg{fill:#fff}
  /* 広がる輪は見せるだけ。タップを吸わないように pointer-events を切ります
     （これが無いと、録音中の2回目の押下がボタンに届きません） */
  .micring.rec::before,.micring.rec::after{
    content:'';position:absolute;inset:-4px;border-radius:50%;
    border:2px solid rgba(255,91,91,.6);animation:ring 1.7s infinite ease-out;
    pointer-events:none;
  }
  .micring{cursor:pointer}
  .micring.rec::after{animation-delay:.85s}
  @keyframes ring{0%{transform:scale(.94);opacity:.9}100%{transform:scale(1.42);opacity:0}}
  .mic[disabled]{background:#d8dce6;cursor:default}
  .mic[disabled] svg{fill:#7b8193}

  .miclabel{font-size:12.5px;color:var(--dim);min-height:19px;text-align:center}
  .miclabel b{color:var(--tx);font-variant-numeric:tabular-nums}

  .gate{padding:44px var(--pad);text-align:center;color:var(--dim);line-height:2;white-space:pre-line}
  .gate img{width:64px;height:64px;border-radius:50%;background:#fff;margin:0 0 18px}
  .gate b{display:block;color:var(--tx);font-size:17px;margin-bottom:12px}
  .ver{text-align:center;color:#3c4354;font-size:10px;padding:0 0 4px}
</style>
</head>
<body>

<header>
  <img class="logo" id="lg" src="https://hiromitsu81.github.io/smf-assets/app/img/smf-logo.png" alt="SMF">
  <span class="logo-fb" id="lgfb">SMF</span>
  <span class="t">Harmonizer</span>
  <span class="who" id="who">つないでいます…</span>
</header>

<main id="main">
  <div class="lead" id="hint">
    <img class="hero" src="https://hiromitsu81.github.io/smf-assets/app/img/smf-logo.png" alt="" onerror="this.style.display='none'">
    <div class="big">押して、話すだけ。</div>
    <div class="sub">ONE HUB から、根拠つきで答えます</div>
  </div>
</main>

<footer id="foot" style="display:none">
  <div class="typebar" id="typebar" style="display:none">
    <textarea id="q" rows="1" placeholder="質問を書く" enterkeyhint="send"></textarea>
    <button class="send" id="send" aria-label="送る">↑</button>
  </div>
  <div class="pads">
    <div class="pad off" id="padRead">
      <div class="ring pink"><button id="bRead" aria-label="読む">
        <svg viewBox="0 0 24 24"><path d="M12 5.5C10.5 4.2 8.3 3.5 6 3.5c-1 0-2 .13-3 .4v15c1-.27 2-.4 3-.4 2.3 0 4.5.7 6 2 1.5-1.3 3.7-2 6-2 1 0 2 .13 3 .4v-15c-1-.27-2-.4-3-.4-2.3 0-4.5.7-6 2Zm.9 2.6c1.1-.62 2.5-.95 3.9-.95.4 0 .8.02 1.2.07v10.9c-.4-.04-.8-.06-1.2-.06-1.5 0-2.9.3-4 .9V8.1Z"/></svg>
      </button></div>
      <div class="cap">読む</div>
    </div>
    <div class="pad" id="padWrite">
      <div class="ring blue"><button id="bWrite" aria-label="書く">
        <svg viewBox="0 0 24 24"><path d="M3 17.25 14.06 6.19l3.75 3.75L6.75 21H3v-3.75Zm17.71-9.96a1 1 0 0 0 0-1.41l-2.59-2.59a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 2.08-1.58Z"/></svg>
      </button></div>
      <div class="cap">書く</div>
    </div>
    <div class="pad" id="padTalk">
      <div class="ring tri" id="micring"><button id="mic" aria-label="話す">
        <svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 1 0-7 0v5.5A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-5 5.92V21h-2v-3.58a6 6 0 0 1-5-5.92h2a4 4 0 0 0 8 0h2Z"/></svg>
      </button></div>
      <div class="cap">話す</div>
    </div>
    <div class="pad off" id="padListen">
      <div class="ring green" id="listenring"><button id="bListen" aria-label="聞く">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-3.74v7.48A4.5 4.5 0 0 0 16.5 12Zm-2-8.4v2.06A6.5 6.5 0 0 1 14.5 18.3v2.06A8.5 8.5 0 0 0 14.5 3.6Z"/></svg>
      </button></div>
      <div class="cap">聞く</div>
    </div>
    <div class="pad" id="padDig">
      <div class="ring amber"><button id="bDig" aria-label="調べる">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.39 1.42-1.42-5.39-5.39A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
      </button></div>
      <div class="cap">調べる</div>
    </div>
  </div>
  <div class="miclabel" id="miclabel" style="margin-top:12px">話すか、書くか。押すだけです</div>
</footer>
<div class="ver" id="ver">Harmonizer v1.6　2026-09-29</div>

<script>
/* ============================================================================
 *  SMF2026 運営向けミニアプリ  v0.6  2026-09-29
 *
 *  ■ この画面のねらい
 *    入力やデータ管理が苦手な人が、押して話すだけで ONE HUB を引けること。
 *    だからマイクを主役にし、打ち込み欄を控えにしています。
 *    ボタンはSMFのロゴと同じ「丸のなかに桃・緑・青」です。
 *
 *  ■ なぜブラウザなのか
 *    LINEのトークに声で返すと、変換と公開の手続きで40〜60秒かかります。
 *    ブラウザはWAVをそのまま鳴らせるので、その手続きがまるごと要りません。
 *
 *  ■ 直すのは下の CONFIG だけです
 * ========================================================================== */
const CONFIG = {
  // 運営用ミニアプリの LIFF ID（来場者向けとは別のチャネル）。
  // 本番用・開発用・審査用のどれで開かれても通るように、順に試します。
  LIFF_IDS: [
    '2011781779-Jc5eAPna',   // 本番用
    '2011781777-mPP3ISYj',   // 開発用
    '2011781778-ogg8f60w'    // 審査用
  ],
  // SMF BOT v3.3 のウェブアプリURL（/exec まで）。来場者向けミニアプリと同じものです
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwNu0dmIaRvZva1bhMtjrEJ-8yXBjInQIC6ULOT0zPoR6GgO6ZYrXHAYzOhX-6uz69v/exec',
  // ロゴ（来場者向けミニアプリのものをそのまま読みます）
  LOGO: 'https://hiromitsu81.github.io/smf-assets/app/img/smf-logo.png',
  // 最初に出す質問の見本
  CHIPS: ['協賛は今何件？', 'ロゴが届いていない協賛は？', '今週が期限のタスクは？', '調子はどう？'],
  // 1文字あたりの速さ（ミリ秒）。小さいほど速い
  TYPE_MS: 16,        // 案内を打ち出す速さ
  ANSWER_MS: 9,       // 答えを打ち出す速さ
  ANSWER_MAX: 600     // これより長い答えは、打ち出さず一度に出す
};

const $ = (id) => document.getElementById(id);
let idToken = '';
let busy = false;
let rec = null, chunks = [], recMime = '', recT0 = 0, recTimer = null;

/* ---------------------------------------------------------------- 画面 */

function clearHint(){ const h = $('hint'); if (h) h.remove(); }

function bubble(who, text){
  clearHint();
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'bub';
  b.textContent = text;
  row.appendChild(b);
  $('main').appendChild(row);
  toBottom();
  return row;
}

function meta(row, text){
  let m = row.querySelector('.meta');
  if (!m) { m = document.createElement('div'); m.className = 'meta'; row.appendChild(m); }
  m.textContent = text;
  toBottom();
}

function state(text){
  clearHint();
  let s = $('st');
  if (!s) {
    s = document.createElement('div');
    s.className = 'state'; s.id = 'st';
    s.innerHTML = '<span class="eq"><i></i><i></i><i></i><i></i></span><span></span>';
    $('main').appendChild(s);
  }
  s.lastElementChild.textContent = text;
  toBottom();
}
function stateOff(){ const s = $('st'); if (s) s.remove(); }

function showErr(text){
  clearHint(); stateOff();
  const d = document.createElement('div');
  d.className = 'err'; d.textContent = text;
  $('main').appendChild(d);
  toBottom();
}

function toBottom(){ const m = $('main'); m.scrollTop = m.scrollHeight; }

function say(msg){
  const h = $('hint');
  if (h) h.innerHTML =
    '<img class="hero" src="' + CONFIG.LOGO + '" alt="" onerror="this.style.display=\'none\'">' +
    '<div class="big" style="font-size:16px">' + msg + '</div>';
  const w = $('who'); if (w) w.textContent = '';
}

/* ---------------------------------------------------------------- 案内 */

/**
 * 文字を1文字ずつ打ち出す。画面に触ると最後まで飛ばせます。
 * 説明を静かに置いておくより、出てくるほうが読んでもらえます。
 */
function typeIn(el, text, ms){
  return new Promise((done) => {
    let i = 0;
    const cur = document.createElement('span');
    cur.className = 'cur';
    el.appendChild(cur);
    let skipped = false;
    const skip = () => { skipped = true; };
    document.addEventListener('pointerdown', skip, { once: true });

    const step = () => {
      if (skipped) i = text.length;
      el.textContent = text.slice(0, i);
      if (i < text.length) { el.appendChild(cur); }
      toBottom();
      if (i >= text.length) {
        document.removeEventListener('pointerdown', skip);
        done();
        return;
      }
      i += skipped ? text.length : 1;
      setTimeout(step, ms);
    };
    step();
  });
}

const GUIDE_FULL = (name) =>
  (name ? name + 'さん、' : '') + 'おはようございます。\n' +
  'ハーモナイザーです。SMFの ONE HUB を、声でも文字でも引けます。\n\n' +
  '① 下の大きなボタンを押して、話す\n' +
  '② もう一度押すと送られます\n' +
  '③ 聞き取った内容と、答えが返ります\n\n' +
  '答えは ONE HUB にある記録だけから作ります。\n' +
  '書いていないことは「見つかりませんでした」と正直に言います。\n' +
  '協賛の金額と、権利の可否（掲載してよいか等）はお答えできません。人が確かめるところです。';

const GUIDE_SHORT = (name) =>
  (name ? name + 'さん、' : '') + 'どうぞ。下のボタンを押して話すか、打ち込んでください。';

/* 読み上げ用。読まない人はここから始められます。
   記号や箇条書きは声に向かないので、骨だけの短い文にしています（240字まで）。 */
const GUIDE_SPOKEN =
  'ハーモナイザーです。SMFのワンハブを、声でも文字でも引けます。' +
  '下の大きなボタンを押して話し、もう一度押すと送られます。' +
  '答えはワンハブの記録だけから作ります。書いていないことは、見つかりませんでした、と正直にお答えします。' +
  '協賛の金額と、掲載してよいかどうかは、お答えできません。';

/** 開いたときの案内。初めての人には長く、2回目からは短く */
async function intro(name){
  clearHint();
  let first = true;
  try { first = !localStorage.getItem('ops:seen'); } catch (e) { /* 使えなくても続ける */ }

  const row = bubble('bot', '');
  const b = row.querySelector('.bub');
  await typeIn(b, first ? GUIDE_FULL(name) : GUIDE_SHORT(name), CONFIG.TYPE_MS);
  try { localStorage.setItem('ops:seen', '1'); } catch (e) { /* 使えなくても続ける */ }

  // 案内そのものを声で聞けるようにします。読まない人はここから始められます。
  speak(GUIDE_SPOKEN, row, '使い方を聞く');

  if (first) {
    const tip = document.createElement('div');
    tip.className = 'meta';
    tip.textContent = '声で聞くこともできます。試しに、下のどれかを押してみてください';
    row.appendChild(tip);
  }
  const chips = document.createElement('div');
  chips.className = 'chips';
  chips.style.justifyContent = 'flex-start';
  chips.style.marginTop = '4px';
  chips.innerHTML = CONFIG.CHIPS.map(x => '<button class="chip">' + x + '</button>').join('') +
    '<button class="chip" data-guide="1">使い方</button>';
  row.appendChild(chips);
  toBottom();
}

/** 「使い方」を押されたとき。いつでも読み直せます */
async function guideAgain(){
  const row = bubble('bot', '');
  await typeIn(row.querySelector('.bub'), GUIDE_FULL(''), CONFIG.TYPE_MS);
  speak(GUIDE_SPOKEN, row, '使い方を聞く');
}

function micLabel(html){ const l = $('miclabel'); if (l) l.innerHTML = html; }

/* ロゴが読めないときは文字にする */
$('lg').onerror = function(){ this.style.display = 'none'; $('lgfb').style.display = 'flex'; };

/** 画面が消える前に、何が起きたかを残す */
window.addEventListener('error', (e) => {
  if (e && e.target && e.target.tagName === 'IMG') return;   // 画像の読み込み失敗は無視
  const h = $('hint') || $('main');
  if (h) h.innerHTML = '<div class="err">画面の中でエラーが出ました：\n' + String((e && e.message) || e).slice(0, 180) + '</div>';
}, true);
window.addEventListener('unhandledrejection', (e) => {
  const h = $('hint') || $('main');
  if (h) h.innerHTML = '<div class="err">処理が止まりました：\n' +
    String((e && e.reason && e.reason.message) || (e && e.reason) || e).slice(0, 180) + '</div>';
});

/* ---------------------------------------------------------------- 通信 */

async function api(payload){
  // ヘッダーは付けません。来場者向けミニアプリで動いている書き方と同じです
  // （文字列を渡すと text/plain になり、事前確認（preflight）が起きません）
  const res = await fetch(CONFIG.GAS_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ kind: 'ops', idToken: idToken }, payload))
  });
  if (!res.ok) throw new Error('つながりませんでした（' + res.status + '）');
  return await res.json();
}

/** つながらなかったとき、どこで落ちているかを確かめる */
async function diagnose(){
  const lines = [];
  try {
    const r = await fetch(CONFIG.GAS_URL + '?api=ouen');
    const t = await r.text();
    if (r.ok && t.indexOf('{') === 0) lines.push('GASは読めています（' + r.status + '）');
    else lines.push('GASの応答が想定外（' + r.status + '）：' + t.slice(0, 60));
  } catch (err) {
    lines.push('GASに届きません：' + String(err.message || err).slice(0, 60));
    lines.push('→ デプロイの「アクセスできるユーザー」が「全員」か確かめてください');
    return lines.join('\n');
  }
  try {
    const r = await fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify({ kind: 'ops', api: 'me', idToken: 'x' }) });
    const t = await r.text();
    if (t.indexOf('login') >= 0) lines.push('運営の入口も生きています（本人確認で弾かれました＝正しい動き）');
    else if (t.indexOf('unknown api') >= 0) lines.push('doPost に ops の1行が入っていません（コード.gs）');
    else lines.push('POSTの応答：' + t.slice(0, 80));
  } catch (err) {
    lines.push('POSTだけ通りません：' + String(err.message || err).slice(0, 60));
    lines.push('→ 新バージョンでデプロイし直されているか確かめてください');
  }
  return lines.join('\n');
}

const ERR = {
  login:      'LINEで開き直してください。運営メンバーとして確かめられませんでした。',
  'too many': '回数の上限に達しました。少し時間をおいてください。',
  'too big':  '録音が長すぎます。短くしてもう一度お願いします。',
  empty:      '聞き取れませんでした。もう一度お願いします。',
  transcribe: '文字にできませんでした。もう一度お願いします。',
  closed:     'いまは使えません。'
};

/* ---------------------------------------------------------------- 聞く */

async function ask(payload, shownText){
  if (busy) return;
  busy = true;
  $('mic').disabled = true;
  micLabel('考えています…');
  const myRow = bubble('me', shownText || '（声で質問）');
  const t0 = Date.now();

  // 返事は1回で返ってくるので、途中の表示は時間で進めます。
  const steps = payload.audio
    ? [[0, '聞き取っています…'], [9, 'ONE HUB を見ています…'], [20, 'もう少しお待ちください…']]
    : [[0, 'ONE HUB を見ています…'], [9, 'もう少しお待ちください…']];
  let si = 0;
  state(steps[0][1]);
  const timer = setInterval(() => {
    const el = (Date.now() - t0) / 1000;
    while (si + 1 < steps.length && el >= steps[si + 1][0]) { si++; state(steps[si][1]); }
  }, 400);

  try {
    const d = await api(Object.assign({ api: 'ask' }, payload));
    clearInterval(timer);
    if (d.error) { showErr(ERR[d.error] || (d.msg || 'うまくいきませんでした')); return; }

    if (payload.audio && d.heard) myRow.querySelector('.bub').textContent = d.heard;
    stateOff();

    // 答えは打ち出します。一気に出すより、読み始めるのが早くなります。
    const row = bubble('bot', '');
    const sec = ((Date.now() - t0) / 1000).toFixed(1) + '秒' + (d.parts ? '　' + d.parts : '');
    const text = String(d.answer || '');
    if (text.length > CONFIG.ANSWER_MAX) row.querySelector('.bub').textContent = text;
    else await typeIn(row.querySelector('.bub'), text, CONFIG.ANSWER_MS);
    meta(row, sec);
    readReady(row);

    // 声は、文字を出し終えてから追いかけます（できるまで3〜50秒かかることがあります）
    if (d.speakable) speak(d.speakable, row);
  } catch (err) {
    clearInterval(timer);
    showErr(String(err.message || err));
  } finally {
    clearInterval(timer); stateOff();
    busy = false;
    $('mic').disabled = false;
    micLabel('押して話す');
  }
}

/* ---------------------------------------------------------------- 声で返す */

/* いちばん新しい声と答えを覚えておきます（「聞く」「読む」で使います） */
let lastAudio = null, lastRow = null;

function listenReady(a){
  lastAudio = a;
  $('padListen').classList.remove('off');
  $('padListen').classList.add('on');
}
function readReady(row){
  lastRow = row;
  $('padRead').classList.remove('off');
}

async function speak(text, row, label){
  const name = label || '聞く';
  const btn = document.createElement('button');
  btn.className = 'play';
  btn.textContent = '♪ 声を用意しています…';
  btn.disabled = true;
  row.appendChild(btn);
  toBottom();

  try {
    const d = await api({ api: 'speak', text: text });
    if (d.error || !d.audio) { btn.remove(); return; }
    // ブラウザは WAV をそのまま鳴らせます（ここが LINE との違いです）
    const audio = new Audio('data:' + (d.mime || 'audio/wav') + ';base64,' + d.audio);
    listenReady(audio);   // 「聞く」で鳴らせるようにする
    btn.textContent = '▶ ' + name;
    btn.disabled = false;
    btn.onclick = () => {
      if (audio.paused) { audio.play(); btn.textContent = '■ 止める'; }
      else { audio.pause(); audio.currentTime = 0; btn.textContent = '▶ ' + name; }
    };
    audio.onended = () => { btn.textContent = '▶ もう一度'; };
    audio.play().then(() => { btn.textContent = '■ 止める'; })
                .catch(() => { /* 自動で鳴らせない端末は押してもらう */ });
  } catch (err) { btn.remove(); }
}

/* ---------------------------------------------------------------- 録音 */

function pickMime(){
  // iPhone は audio/mp4、Android は audio/webm が通ります。
  const list = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/aac'];
  for (const m of list) {
    try { if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; } catch (e) { /* 次を試す */ }
  }
  return '';   // 指定なしで、ブラウザに任せる
}

async function recStart(){
  if (busy) { showErr('いま前の質問を処理しています。'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showErr('このブラウザではマイクが使えません。打ち込みで聞いてください。'); return;
  }
  if (!window.MediaRecorder) {
    showErr('このブラウザは録音に対応していません。打ち込みで聞いてください。'); return;
  }
  try {
    micLabel('マイクの許可を確かめています…');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recMime = pickMime();
    rec = new MediaRecorder(stream, recMime ? { mimeType: recMime } : undefined);
    chunks = [];
    const usedMime = rec.mimeType || recMime || 'audio/mp4';

    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onerror = (e) => { showErr('録音でエラーが出ました：' + String((e && e.error && e.error.name) || e).slice(0, 80)); };
    rec.onstop = async () => {
      // どの道を通っても、最後にラベルは「押して話す」に戻します
      const back = () => micLabel('押して話す');
      try {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: usedMime });
        if (!chunks.length) { back(); showErr('音が取れませんでした（' + usedMime + '）。打ち込みで聞いてください。'); return; }
        if (blob.size < 1200) { back(); showErr('短すぎました（' + blob.size + 'バイト）。押してから、1秒以上話してください。'); return; }
        const b64 = await toBase64(blob);
        if (!b64) { back(); showErr('音声を変換できませんでした。打ち込みで聞いてください。'); return; }
        ask({ audio: b64, mime: usedMime.split(';')[0] });   // ここから先は ask が面倒を見ます
      } catch (err) {
        back();
        showErr('送るところで止まりました：' + String(err.message || err).slice(0, 110));
      }
    };

    rec.start();
    recT0 = Date.now();
    $('micring').classList.add('rec');
    recTimer = setInterval(() => {
      micLabel('<b>' + ((Date.now() - recT0) / 1000).toFixed(1) + '秒</b>　もう一度押すと送ります');
    }, 100);
  } catch (err) {
    micLabel('押して話す');
    showErr('マイクを使えませんでした（' + String((err && err.name) || err).slice(0, 40) + '）。\n' +
      'iPhoneの［設定］→［LINE］→［マイク］が オン になっているか確かめてください。\n' +
      '打ち込みでも聞けます。');
  }
}

function recStop(){
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  $('micring').classList.remove('rec');
  if (!rec) { micLabel('押して話す'); return; }
  if (rec.state === 'inactive') { micLabel('押して話す'); showErr('録音が始まっていませんでした。もう一度押してください。'); rec = null; return; }
  micLabel('送っています…');
  const r = rec; rec = null;
  try { r.stop(); }
  catch (err) { micLabel('押して話す'); showErr('止めるところで失敗しました：' + String(err.message || err).slice(0, 90)); }
}

function toBase64(blob){
  return new Promise((ok, ng) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1] || '');
    r.onerror = ng;
    r.readAsDataURL(blob);
  });
}

/* ---------------------------------------------------------------- 立ち上げ */

/* ---------------------------------------------------------------- 5つの動詞 */

/* 話す：押して録音、もう一度押して送る。
   押す場所は輪の外側まで含めます（録音中に輪が広がっても取りこぼしません） */
function micTap(){
  if (rec && rec.state === 'recording') recStop();
  else if (!$('mic').disabled) recStart();
}
$('micring').addEventListener('click', micTap);

/* 書く：打ち込み欄を出す／隠す。最初は隠してあります */
$('bWrite').onclick = () => {
  const t = $('typebar');
  const show = t.style.display === 'none';
  t.style.display = show ? 'flex' : 'none';
  $('padWrite').classList.toggle('on', show);
  if (show) { $('q').focus(); micLabel('書いて ↑ で送ります'); }
  else micLabel('話すか、書くか。押すだけです');
};

/* 聞く：いちばん新しい答えを声で鳴らす。まだ無ければ使い方を読み上げる */
$('bListen').onclick = async () => {
  if ($('padListen').classList.contains('off')) return;
  if (!lastAudio) return;
  const ring = $('listenring');
  if (!lastAudio.paused) { lastAudio.pause(); lastAudio.currentTime = 0; ring.classList.remove('busy'); return; }
  ring.classList.add('busy');
  lastAudio.onended = () => ring.classList.remove('busy');
  try { await lastAudio.play(); } catch (e) { ring.classList.remove('busy'); }
};

/* 読む：いちばん新しい答えを大きな字にして、画面に持ってくる */
$('bRead').onclick = () => {
  if (!lastRow) return;
  const b = lastRow.querySelector('.bub');
  b.classList.toggle('zoom');
  $('padRead').classList.toggle('on', b.classList.contains('zoom'));
  lastRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
  micLabel(b.classList.contains('zoom') ? '大きい字にしました。もう一度押すと戻ります' : '話すか、書くか。押すだけです');
};

/* 調べる：ひとつの答えではなく、いま気にすべきことを横断で拾う。
   単発の質問と役割を分けています（「何件？」ではなく「何が引っかかっているか」） */
const DIG = [
  ['返答待ちの協賛は？',            '打診したのに返事が来ていないところ'],
  ['ロゴが届いていない協賛は？',    'サイトに出せていないところ'],
  ['アー写が来ていない出演者は？',  '発表に間に合わないおそれ'],
  ['期限を過ぎているタスクは？',    '遅れているもの'],
  ['会場でまだ取得できていないのは？', '押さえられていない会場'],
  ['調子はどう？',                  'ONE HUB に足りないところ']
];
$('bDig').onclick = async () => {
  const row = bubble('bot', '');
  await typeIn(row.querySelector('.bub'),
    '何を調べますか。\nひとつ押すと、ONE HUB を横断して拾います。', CONFIG.TYPE_MS);
  const m = document.createElement('div');
  m.className = 'digmenu';
  m.innerHTML = DIG.map(x =>
    '<button class="chip" title="' + x[1] + '">' + x[0] + '</button>').join('');
  row.appendChild(m);
  toBottom();
};

function send(t){
  if (!t) { showErr('入力欄に質問を打つか、マイクを押して話してください。'); return; }
  if (busy) { showErr('いま前の質問を処理しています。返事が来るまでお待ちください。'); return; }
  ask({ text: t }, t);
}
$('send').onclick = () => {
  const t = $('q').value.trim();
  $('q').value = ''; $('q').style.height = 'auto'; $('send').classList.remove('on');
  if (t) { $('typebar').style.display = 'none'; $('padWrite').classList.remove('on'); }
  send(t);
};
$('q').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(104, this.scrollHeight) + 'px';
  $('send').classList.toggle('on', !!this.value.trim());
});
document.addEventListener('click', (e) => {
  const c = e.target.closest('.chip');
  if (!c) return;
  if (c.dataset.guide) { guideAgain(); return; }
  send(c.textContent.trim());
});

function gate(msg){
  $('main').innerHTML = '<div class="gate">' +
    '<img src="' + CONFIG.LOGO + '" alt="" onerror="this.style.display=\'none\'">' +
    '<b>使えません</b>' + msg + '</div>';
  $('foot').style.display = 'none';
  $('who').textContent = '';
}

(async () => {
  try {
    if (typeof liff === 'undefined') {
      gate('LINEの部品を読み込めませんでした。\n通信を確かめて、開き直してください。');
      return;
    }
    // どのLIFF IDで開かれたか分からないので、順に試します
    let used = '', lastErr = null;
    for (const id of CONFIG.LIFF_IDS) {
      say('LINEにつないでいます…');
      try { await liff.init({ liffId: id }); used = id; break; }
      catch (e) { lastErr = e; }
    }
    if (!used) {
      gate('LINEにつなげませんでした。\n' + String((lastErr && lastErr.message) || lastErr || '').slice(0, 120) +
        '\nLINE Developers で、エンドポイントURLがこのページになっているか確かめてください。');
      return;
    }
    $('ver').textContent = $('ver').textContent + '　/ ' + used.split('-')[0];

    say('本人を確かめています…');
    // liff.login() は呼びません。ミニアプリの中で呼ぶと、窓が閉じたり往復したりします。
    if (!liff.isLoggedIn || !liff.isLoggedIn()) {
      gate('LINEアプリの中から開いてください。\nブラウザで直接開くと使えません。');
      return;
    }
    idToken = liff.getIDToken() || '';
    if (!idToken) {
      gate('本人を確かめられませんでした。\nLINE Developers のミニアプリのチャネルで、Scope の openid がオンになっているか確かめてください。');
      return;
    }

    say('ONE HUB につないでいます…');
    const me = await api({ api: 'me' });
    if (me.error) {
      gate(me.error === 'login'
        ? 'この画面は運営メンバー専用です。\n心当たりがあれば事務局にお伝えください。'
        : 'いまは使えません。');
      return;
    }
    $('who').innerHTML = '<span class="led"></span>' + (me.name || '');
    $('foot').style.display = 'block';
    intro(me.name || '');
  } catch (err) {
    gate('つなげませんでした。\n' + String(err.message || err).slice(0, 90) + '\n\n調べています…');
    try {
      const d = await diagnose();
      const g = document.querySelector('.gate');
      if (g) g.innerHTML =
        '<img src="' + CONFIG.LOGO + '" alt="" onerror="this.style.display=\'none\'">' +
        '<b>使えません</b>つなげませんでした。\n' + String(err.message || err).slice(0, 90) + '\n\n' + d;
    } catch (e) { /* 診断できなくてもよい */ }
  }
})();
